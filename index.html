<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Repuestos Yanacocha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="author" content="Luis Miguel Vargas Arango">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,700;1,800&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: aspecto SAP GUI (tema claro azulado): barra de título en cursiva, barra de herramientas, pestañas tipo tabstrip, recuadros de grupo con cabecera, campos tipo SAP y barra de estado. Tema único claro, deliberado. */
:root{
  --bg:#e4ebf2; --bgtop:#f3f6f9; --title:#f6f8fb; --tool:#e9eff5; --panel:#f6f8fa; --head:#dde7f0; --white:#ffffff;
  --line:#a7bacd; --line2:#cfdae5; --fg:#18283a; --muted:#3f5266; --dim:#56697d; --ttl:#0b2747;
  --blue:#2a659b; --blue2:#3f78ad; --soft:#dbe8f5; --soft2:#eef4fa; --ro:#e8eef4; --fbord:#8ea3b8; --yel:#fffbd0; --redc:#d0312d;
  --green:#1d7436; --orange:#a85300; --red:#b0001e; --info:#0a5aa8; --violet:#5f45a8;
  --alm:#0b7a75; --pla:#b14c0c; --ana:#2a659b; --lid:#18283a;
  --ui:"Open Sans",Arial,Helvetica,sans-serif; --mono:"Roboto Mono","Courier New",monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--bgtop) 0,var(--bg) 380px) fixed;color:var(--fg);font-family:var(--ui);font-size:13.5px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--title)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px dotted var(--ttl);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.wrapx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barra de título + herramientas */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;box-shadow:0 1px 0 var(--line)}
.tbar{background:linear-gradient(180deg,#fbfcfd,#e8eef4);border-bottom:1px solid var(--line2)}
.tbar .in{display:flex;align-items:center;gap:12px;padding-block:8px;max-width:1500px;margin:0 auto}
.ico{width:30px;height:30px;border-radius:4px;background:linear-gradient(180deg,#fdfdfd,#dfe6ee);border:1px solid var(--fbord);display:grid;place-items:center;flex:none}
.ico svg{width:18px;height:18px;stroke:var(--blue);fill:none;stroke-width:1.8}
.ttl{min-width:0;flex:1}
.ttl h1{font-size:21px;font-weight:800;font-style:italic;margin:0;color:var(--ttl);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.author{font-size:12px;color:var(--muted);text-align:right;line-height:1.3;white-space:nowrap}
.author b{color:var(--ttl);font-size:13px}
.tools{background:var(--tool);border-bottom:1px solid var(--line2)}
.tools .in{display:flex;align-items:center;gap:4px;padding-block:5px;max-width:1500px;margin:0 auto;overflow-x:auto}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:3px;border:1px solid transparent;background:transparent;cursor:pointer;font-size:13px;white-space:nowrap;color:var(--fg)}
.tbtn:hover{border-color:var(--fbord);background:linear-gradient(180deg,#fff,#e3eaf1)}
.tbtn svg{width:15px;height:15px;stroke:var(--blue);fill:none;stroke-width:2}
.sep{width:1px;height:20px;background:var(--line);margin:0 6px;flex:none}
.corte{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;padding-left:10px}

.menus{display:flex;gap:4px}
.mn{position:relative}
.mbtn{height:30px;padding:0 12px;border:1px solid var(--fbord);border-radius:3px;background:linear-gradient(180deg,#fff,#e3eaf1);cursor:pointer;font-weight:600;color:var(--fg);white-space:nowrap}
.mbtn:hover,.mbtn[aria-expanded="true"]{background:linear-gradient(180deg,#fff,#d6e2ee);border-color:var(--blue)}
.mlist{position:absolute;right:0;top:calc(100% + 4px);width:330px;max-width:calc(100vw - 32px);background:var(--white);border:1px solid var(--fbord);border-radius:3px;box-shadow:0 10px 28px rgba(11,39,71,.25);padding:4px 0;display:none;z-index:80;max-height:calc(100vh - 120px);overflow:auto}
.mlist.open{display:block;animation:fade .15s ease both}
.mlist .mh{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px;border-top:1px solid var(--line2)}
.mlist .mh:first-child{border-top:0}
.mlist button{display:grid;gap:1px;width:100%;text-align:left;border:0;background:transparent;padding:6px 12px 6px 22px;cursor:pointer}
.mlist button:hover,.mlist button:focus-visible{background:#fff8c8;outline:0}
.mlist button b{font-weight:600;color:var(--fg)}
.mlist button span{font-size:12px;color:var(--muted)}
/* Pestañas (tabstrip) */
.tabs{background:var(--bg);padding-top:10px}
.tabs .in{display:flex;gap:2px;overflow-x:auto;max-width:1500px;margin:0 auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{flex:none;display:flex;align-items:center;gap:7px;height:32px;padding:0 14px;border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#f3f6f9,#dbe4ed);cursor:pointer;font-size:13px;color:var(--fg);position:relative;top:1px}
.tab b{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:700}
.tab:hover{background:linear-gradient(180deg,#fff,#e6edf4)}
.tab.on{background:var(--panel);font-weight:700;color:var(--ttl);height:34px;margin-top:-2px;border-top:2px solid var(--blue);z-index:1}
.tab.seen:not(.on) b::after{content:" ✓";color:var(--green)}

main{max-width:1500px;margin:0 auto;padding-block:16px 70px}
.stage{display:grid;gap:14px;animation:fade .35s ease both}
@keyframes fade{from{transform:translateY(6px)}to{transform:none}}

/* Recuadros de grupo */
.grp{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0;overflow:hidden}
.grp>.gh{background:linear-gradient(180deg,#e9f0f6,#d9e3ed);border-bottom:1px solid var(--line);padding:6px 12px;font-size:13px;font-weight:600;color:var(--ttl);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grp>.gh .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grp>.gb{padding:14px;display:grid;gap:12px;min-width:0}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.h2{font-size:26px;font-weight:800;font-style:italic;margin:2px 0 4px;line-height:1.15;color:var(--ttl);text-wrap:balance}
.h2 em{font-style:italic;color:var(--blue)}
.h3{font-size:16px;font-weight:700;margin:0;color:var(--ttl)}
.lead{color:var(--muted);margin:0;max-width:80ch;font-size:14px}
.sm{font-size:12.5px;color:var(--muted)}
.cols{display:grid;gap:14px}
.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.split2{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr)}
.taxo{grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr)}

/* Campos tipo SAP */
.form{display:grid;grid-template-columns:minmax(150px,auto) minmax(0,1fr);gap:6px 14px;align-items:center}
.form .lb{border-bottom:1px solid var(--line2);padding:3px 0;color:var(--fg)}
.fv{font-family:var(--mono);font-size:13px;background:var(--ro);border:1px solid #c3d0dc;border-radius:2px;padding:3px 8px;min-height:26px;display:flex;align-items:center;overflow-wrap:anywhere}
.fv.w{background:var(--white);border-color:var(--fbord)}
.fv.y{background:var(--yel);border-color:#c9b860}
input.sap,select.sap{height:28px;border:1px solid var(--fbord);border-radius:2px;background:var(--white);padding:0 8px;font-family:var(--mono);font-size:13px;width:100%;min-width:0}
input.sap:focus,select.sap:focus{outline:0;background:var(--yel);border-color:var(--redc);box-shadow:0 0 0 1px var(--redc)}
.fld{display:grid;gap:3px;min-width:0}
.fld>label{font-size:12.5px;color:var(--fg);display:flex;gap:6px;align-items:center;justify-content:space-between}
.src{font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:2px;white-space:nowrap}
.src.me{background:#e1f0e3;color:var(--green);border:1px solid #9fcca8}
.src.su{background:#fff1d6;color:var(--orange);border:1px solid #e3be7c}
.src.us{background:var(--soft);color:var(--info);border:1px solid #a9c6e6}

/* Indicadores */
.kpi{background:var(--white);border:1px solid var(--line2);border-radius:4px;padding:11px 13px;min-width:0;display:flex;flex-direction:column;gap:1px}
.kpi .v{font-size:30px;font-weight:800;line-height:1.05;color:var(--ttl)}
.kpi .v.am,.kpi .v.gr,.kpi .v.rd,.kpi .v.dk{color:var(--ttl)}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px}
.kpi .l{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .s{font-size:12px;color:var(--dim)}
button.kpi{cursor:pointer;text-align:left}
button.kpi:hover,button.kpi.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:2px;white-space:nowrap;border:1px solid}
.ch-gr{background:#e3f2e6;color:var(--green);border-color:#a8d2b2} .ch-am{background:#fff0dc;color:var(--orange);border-color:#e6bf8a}
.ch-cy{background:#e1eefb;color:var(--info);border-color:#a9c8ea} .ch-rd{background:#fbe5e8;color:var(--red);border-color:#e6a9b3}
.ch-vi{background:#ece7f8;color:var(--violet);border-color:#c2b4e6} .ch-nu{background:#eef2f6;color:var(--muted);border-color:#c7d2dd}
.btn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 14px;border-radius:3px;border:1px solid var(--blue);background:linear-gradient(180deg,#4a86bd,#2a659b);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:linear-gradient(180deg,#5893c9,#2f6fa8)}
.btn.ghost{background:linear-gradient(180deg,#fff,#e3eaf1);color:var(--fg);border-color:var(--fbord)}
.btn.ghost:hover{background:linear-gradient(180deg,#fff,#d8e3ee)}
.seg{display:inline-flex;border:1px solid var(--fbord);border-radius:3px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line2);background:linear-gradient(180deg,#fff,#e8eef4);padding:4px 11px;cursor:pointer;font-size:12.5px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:#fff;font-weight:700}
.note{border-left:3px solid var(--orange);background:#fff7e8;padding:8px 12px;font-size:13px;color:var(--fg)}
.note b{color:var(--ttl)}
.info{border-left:3px solid var(--info);background:var(--soft2);padding:8px 12px;font-size:13px}
.info b{color:var(--ttl)}

/* Portada */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:10px;align-items:center}
.hero .q{font-size:38px;font-weight:800;font-style:italic;line-height:1.08;margin:6px 0 10px;color:var(--ttl);text-wrap:balance}
.hero .q em{color:var(--blue);font-style:italic}
.by{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--white);border:1px solid var(--line2);border-radius:4px;width:fit-content;max-width:100%}
.by .av{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.pumpbox{background:radial-gradient(circle at 50% 45%,#ffffff 0,#e3ecf4 60%,#d3dfea 100%);border:1px solid var(--line2);border-radius:6px;padding:10px}
.pumpwrap{position:relative;width:100%;max-width:400px;margin:0 auto;aspect-ratio:820/1025}
.pumpwrap img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 18px 22px rgba(11,39,71,.35))}
.hs{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:0;background:transparent;cursor:pointer;padding:0}
.hs::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#ffb300;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(11,39,71,.35)}
.hs::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #ffb300;animation:ping 2.2s ease-out infinite;opacity:0}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.8);opacity:0}}
.hs.sel::before{background:var(--blue);box-shadow:0 0 0 2px #fff,0 0 0 5px rgba(42,101,155,.5)}
.hs.sel::after{border-color:var(--blue)}
.hs .tip{position:absolute;left:28px;top:50%;transform:translateY(-50%);white-space:nowrap;background:#fffbd0;border:1px solid #9a8a3a;padding:2px 7px;font-size:11.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s;z-index:3;color:var(--fg)}
.hs:hover .tip,.hs:focus-visible .tip,.hs.sel .tip{opacity:1}
.hs.left .tip{left:auto;right:28px}

/* Tablas tipo ALV */
.tw{overflow:auto;border:1px solid var(--line);background:var(--white)}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 9px;border:1px solid #d6e0ea;text-align:left;vertical-align:middle;font-size:12.5px}
th{background:linear-gradient(180deg,#eef3f8,#dbe5ee);color:var(--ttl);font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:1}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:2px dotted var(--ttl)}
td.r,th.r{text-align:right}
tbody tr:nth-child(even){background:#f5f8fb}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#fff8c8}
tbody tr.sel{background:#cfe1f3!important}
tbody tr.off{opacity:.35}
.tag{font-family:var(--mono);font-weight:700;color:var(--ttl);white-space:nowrap}
.yrs{display:inline-flex;gap:2px;vertical-align:middle}
.yrs i{width:6px;height:13px;background:#d3dde7}
.yrs i.y{background:var(--blue)}

/* Taxonomía */
.ladder{display:grid;gap:5px}
.rung{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;background:var(--white);border:1px solid var(--line2);border-radius:3px;padding:6px 10px}
.rung b{width:24px;height:24px;border-radius:3px;display:grid;place-items:center;background:var(--soft2);border:1px solid var(--line2);font-family:var(--mono);font-size:12px;color:var(--muted)}
.rung .k{font-size:11.5px;color:var(--muted)}
.rung .val{font-weight:600}
.rung.act{border-color:var(--blue);background:var(--soft2)}
.rung.act b{background:var(--blue);color:#fff;border-color:var(--blue)}
.rung.pend .val{color:var(--muted);font-weight:400}
.zones{display:flex;flex-wrap:wrap;gap:4px}
.zbtn{border:1px solid var(--fbord);background:linear-gradient(180deg,#fff,#e8eef4);border-radius:3px;padding:3px 9px;font-size:12px;cursor:pointer}
.zbtn.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.items{display:grid;gap:5px}
.item{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--white);border:1px solid var(--line2);border-radius:3px;padding:7px 10px;cursor:pointer;text-align:left;width:100%;animation:fade .3s ease both}
.item:hover{background:#fff8c8;border-color:#c9b860}

/* Flujo de fuentes */
.flow{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr);align-items:stretch}
.srcs{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--white);border:1px solid var(--line2);border-radius:3px;padding:7px 10px}
.srow .ic{height:26px;border-radius:2px;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:700;color:#fff}
.srow.ok{border-color:#9fcca8;background:#f3faf4}
.flow svg{width:100%;height:100%;min-height:240px}
.sink{align-self:center;background:var(--white);border:1px solid var(--blue);border-radius:4px;padding:14px;box-shadow:0 0 0 3px var(--soft)}

.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--ui);fill:#3f5266;font-size:11px}
.chart .gl{stroke:#d6e0ea;stroke-width:1}
.dotp{cursor:pointer;transition:opacity .2s}
.dotp:hover{stroke:#000;stroke-width:2}

/* Matriz */
.mx{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:6px}
.mx .ax{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px}
.cell{border-radius:3px;padding:10px;min-height:96px;display:flex;flex-direction:column;gap:5px;border:1px solid var(--line2);background:var(--white);min-width:0}
.cell .t{font-weight:800;font-size:14.5px;color:var(--ttl)}
.cell .d{font-size:12.5px;color:var(--muted)}
.cell.a{background:#eef4fa;border-color:#c3d4e6}
.cell.b{background:#eef4fa;border-color:#c3d4e6}
.cell.c{background:#f6f8fa;border-color:#d3dde7}
.cell.e{background:#f6f8fa;border-color:#d3dde7}
.lane{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 6px;border-radius:2px;background:var(--white);border:1px solid var(--fbord);cursor:pointer;color:var(--ttl)}
.pill:hover{background:#fff8c8}
.qrow{display:grid;grid-template-columns:22px minmax(0,1fr) repeat(3,58px);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2)}
.qrow>b{font-family:var(--mono);color:var(--muted)}
.qs{text-align:center}

/* Simulador */
.fx{display:grid;grid-template-columns:minmax(0,165px) minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--white);border:1px solid var(--line2);border-radius:3px;padding:10px 12px}
.fx code{font-family:var(--mono);font-weight:700;color:var(--ttl);font-size:13.5px}
.fx .res{font-size:28px;font-weight:800;color:var(--ttl);min-width:52px;text-align:right}
.calcline{font-family:var(--mono);font-size:12px;color:var(--muted);grid-column:1/-1;border-top:1px dashed var(--line2);padding-top:6px}
.stockbar{position:relative;height:72px;border:1px solid var(--line2);background:var(--white);overflow:hidden}
.stockbar i{position:absolute;top:0;bottom:0;left:0;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.stockbar span{position:absolute;font-family:var(--mono);font-size:10.5px;font-weight:700;transform:translateX(-100%);padding-right:6px;white-space:nowrap}
.yeartbl td,.yeartbl th{text-align:center;padding:4px 5px;font-family:var(--mono);font-size:12px}

/* Gantt */
.gantt{overflow-x:auto;background:var(--white);border:1px solid var(--line)}
.gg{display:grid;min-width:1020px;font-size:12.5px}
.gg>div{padding:7px 6px;border-bottom:1px solid #e1e8ef;display:flex;align-items:center;min-width:0}
.gg .hd{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ttl);justify-content:center;background:#eef3f8}
.gg .hl{justify-content:flex-start}
.gg .wk{justify-content:center;font-family:var(--mono);font-weight:700;color:var(--ttl);font-size:11.5px;background:#e3ebf3}
.gg .dato{background:#fff7e3}
.gg .bar i{display:block;height:18px;width:100%;border-radius:2px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.gg .ms{justify-content:center}
.gg .ms i{width:13px;height:13px;transform:rotate(45deg);background:var(--lid);display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;display:inline-block}

/* 4 Datos */
function sDatos(){
  const v=D.validacion;
  const yrs=Object.keys(R[0].compras).sort();
  const tot=yrs.map(y=>R.reduce((a,r)=>a+(r.compras[y]||0),0));
  const max=Math.max(...tot);
  const W=900,H=240,pl=40,pb=26,top=22,bw=(W-pl-8)/yrs.length;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Unidades compradas por año, 28 repuestos">`;
  [0,.5,1].forEach(f=>{const t=Math.round(max*f),y=H-pb-f*(H-pb-top);svg+=`<line class="gl" x1="${pl}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pl-8}" y="${y+4}" text-anchor="end">${t}</text>`});
  yrs.forEach((y,i)=>{const h=Math.max(1.5,tot[i]/max*(H-pb-top)),x=pl+i*bw+4,w=bw-8;const c=y==="2026"?"#9dbcdb":(+y<2016?"#b9cbdd":"#2a659b");
    svg+=`<rect x="${x}" y="${H-pb-h}" width="${w}" height="${h}" fill="${c}"/><text x="${x+w/2}" y="${H-pb-h-6}" text-anchor="middle" style="fill:#18283a;font-weight:700">${tot[i]}</text><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${y}</text>`});
  svg+="</svg>";
  const icon={ME2M:["#1d7436","ME2M"],MB51:["#0b7a75","MB51"],MB52:["#0b7a75","MB52"],IW39:["#b14c0c","IW39"],"Criticidad":["#b14c0c","5 P"]};
  const n=D.fuentes.length,ys=D.fuentes.map((f,i)=>30+i*(220/(n-1)));
  let fl=`<svg viewBox="0 0 110 280" preserveAspectRatio="none" aria-hidden="true">`;
  D.fuentes.forEach((f,i)=>{const ok=f.estado==="Recibido",c=ok?"#1d7436":"#c26100",p=`M0 ${ys[i]} C 55 ${ys[i]}, 55 140, 110 140`;fl+=`<path d="${p}" fill="none" stroke="${c}" stroke-width="2" ${ok?"":'stroke-dasharray="5 5"'} opacity="${ok?1:.65}"/>${ok?`<circle r="4" fill="${c}"><animateMotion dur="2.4s" repeatCount="indefinite" path="${p}"/></circle>`:""}`});
  fl+="</svg>";
  return `<section class="stage">
  ${head(4,"Fuentes de datos · ISO 14224","Sin datos no hay stock: <em>5 fuentes alimentan el análisis</em>","Una ya está procesada. Las otras cuatro las entregan Almacén y Planificación, y cada una tiene un uso preciso.")}
  ${grp("Fuentes y base del análisis",`<div class="flow">
      <div class="srcs">${D.fuentes.map(f=>{const ok=f.estado==="Recibido";const ic=icon[f.transaccion]||["#56697d",f.transaccion];return `<div class="srow ${ok?"ok":""}"><span class="ic" style="background:${ic[0]}">${ic[1]}</span><div><b>${esc(f.transaccion)} · ${esc(f.nombre)}</b><div class="sm">${esc(f.responsable)} · ${esc(f.uso)}</div></div><span class="chip ${ok?"ch-gr":"ch-am"}">${ok?"Recibido":"Pendiente"}</span></div>`}).join("")}</div>
      ${fl}
      <div class="sink"><div class="eyebrow">Base del análisis · estructura ISO 14224</div><div class="h3" style="margin-top:4px">${recib()} de ${D.fuentes.length} fuentes recibidas</div><p class="sm" style="margin:6px 0 10px">Con las 5 fuentes, cada repuesto queda con: consumo real por año, lead time real, stock actual, tipo de orden (preventiva o correctiva), bomba donde se cambió y criticidad por planta.</p><button class="btn" data-win="fuentes">Ver el detalle de cada pedido</button></div>
    </div>`)}
  <div class="cols split">
    ${grp("Unidades compradas por año · 28 repuestos",`<div class="sm">ME2M, centro 3000, sin líneas anuladas. Los promedios usan 2016–2025 (azul oscuro); 2026 llega hasta el ${sapd(D.config.corteHistorial)}.</div><div class="chart">${svg}</div>`)}

        <div class="kpi"><span class="v num">${fmt(v.lineas)}</span><span class="l">Líneas</span><span class="s">${fmt(v.oc)} órdenes de compra</span></div>
        <div class="kpi"><span class="v num gr">${v.codigosConCompra}<small>de 28</small></span><span class="l">Códigos con compras</span><span class="s">Sin compras: TS-27 estator nuevo</span></div>
        <div class="kpi"><span class="v num rd">${v.anuladas}</span><span class="l">Líneas anuladas</span><span class="s">Excluidas del análisis</span></div>
        <div class="kpi"><span class="v num am">${v.precioDif}</span><span class="l">Precios &gt;100 % vs estándar</span><span class="s">El estándar tiene precios de 2010</span></div>

/* 5 Demanda */
function match(r){const f=ST.f,q=f.q.trim().toLowerCase();
  return (!f.zona||r.zona===f.zona)&&(!f.patron.length||f.patron.includes(r.patron))&&(!f.kit||r.std["En kit MP41 de LQ"]===f.kit)&&(!f.prio||r.std["Prioridad YN"]===f.prio)&&(!f.prop||pv(r)===f.prop)&&(!q||[r.id,r.sap,r.desc].join(" ").toLowerCase().includes(q))}
const CPAL=["#2a659b","#c26100","#1d7436","#b0001e","#5f45a8","#0b7a75","#8a6d00","#a23b72","#3f5266","#6b8e23","#d35400"];
function colorOf(r){const c=ST.f.color;
  if(c==="zona")return CPAL[ZONES.findIndex(z=>z[0]===r.zona)%CPAL.length];
  if(c==="kit")return r.std["En kit MP41 de LQ"]==="Sí"?"#1d7436":"#8a9db1";
  if(c==="prio")return r.std["Prioridad YN"]==="A"?"#b0001e":"#2a659b";
  return PAT[r.patron][1]}
function legendHtml(){const c=ST.f.color;
  if(c==="zona")return ZONES.map((z,i)=>`<span><i style="background:${CPAL[i%CPAL.length]}"></i>${esc(z[0])}</span>`).join("");

function spark(r,w=440,h=120){
  const yrs=Object.keys(r.compras).sort(),vals=yrs.map(y=>r.compras[y]),mx=Math.max(1,...vals),pb=18,top=16,bw=(w-4)/yrs.length;
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Compras por año de ${esc(r.id)}">`;
  yrs.forEach((y,i)=>{const v=vals[i],hh=v?v/mx*(h-pb-top):1.5,x=2+i*bw+2,ww=bw-4;
    s+=`<rect x="${x}" y="${h-pb-hh}" width="${ww}" height="${hh}" fill="${v?(y==="2026"?"#9dbcdb":(+y<2016?"#b9cbdd":"#2a659b")):"#d3dde7"}"/>`;
    if(v)s+=`<text x="${x+ww/2}" y="${h-pb-hh-4}" text-anchor="middle" style="fill:#18283a;font-size:10px;font-weight:700">${v}</text>`;
    if(i%2===0)s+=`<text x="${x+ww/2}" y="${h-4}" text-anchor="middle" style="font-size:10px">’${y.slice(2)}</text>`});
  return s+"</svg>";
}

function sim0(r){const v=[];for(let y=2016;y<=2025;y++)v.push(r.compras[y]||0);const sum=v.reduce((a,b)=>a+b,0),m=sum/v.length;const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/(v.length-1));
  return {id:r.id,vals:v,sum,D:+m.toFixed(1),S:+sd.toFixed(1),LT:60,Z:"2.33",Q:Math.max(1,Math.round(m)),D0:+m.toFixed(1),S0:+sd.toFixed(1)}}

function calcOut(){
  const el=$("#calcOut");if(!el)return;const c=ST.calc;
  const d=c.D/365,sd=c.S/Math.sqrt(365),Z=+c.Z,LT=Math.max(1,c.LT),Q=+c.Q||0;
  const ssr=Z*sd*Math.sqrt(LT),SS=Math.ceil(ssr),prr=d*LT+SS,PR=Math.ceil(prr),MX=PR+Q;
  const top=Math.max(MX,1)*1.12,pc=x=>Math.max(4,x/top*100),n=x=>fmt(x,x<1?3:2);
  el.innerHTML=`
  <div class="fx"><code>SS = Z · σ · √LT</code><p class="sm" style="margin:0"><b style="color:var(--fg)">Mínimo (stock de seguridad):</b> cubre un consumo mayor al normal mientras llega el pedido.</p><span class="res num">${SS}</span><span class="calcline">σ diaria = ${fmt(c.S,1)} ÷ √365 = ${n(sd)} · SS = ${String(c.Z).replace(".",",")} × ${n(sd)} × √${LT} = ${fmt(ssr,2)} → ${SS}</span></div>
  <div class="fx"><code>PR = d · LT + SS</code><p class="sm" style="margin:0"><b style="color:var(--fg)">Punto de reorden:</b> al bajar a este número se pide la compra.</p><span class="res num">${PR}</span><span class="calcline">d = ${fmt(c.D,1)} ÷ 365 = ${n(d)} und./día · PR = ${n(d)} × ${LT} + ${SS} = ${fmt(prr,2)} → ${PR}</span></div>
  <div class="fx"><code>Máx = PR + Q</code><p class="sm" style="margin:0"><b style="color:var(--fg)">Máximo:</b> tope de stock después de recibir el pedido.</p><span class="res num">${MX}</span><span class="calcline">Máx = ${PR} + ${Q} = ${MX}</span></div>

  <p class="sm" style="margin:0">Se redondea hacia arriba. Para repuestos esporádicos y críticos se usa la distribución de Poisson en lugar de σ.</p>`;
}

/* 8 Plan */
function sPlan(){
  const P=D.plan.slice().sort((a,b)=>a.orden-b.orden);
  const ds=[...new Set(P.flatMap(p=>[p.inicio,p.fin]))].sort();const all=[];
  let d=new Date(ds[0]+"T12:00:00");const end=new Date(ds[ds.length-1]+"T12:00:00");
  while(d<=end){const w=d.getDay();if(w>0&&w<6)all.push(iso(d));d=new Date(d.getTime()+864e5)}
  const n=all.length,dl=s=>{const x=new Date(s+"T12:00:00");return ["D","L","M","X","J","V","S"][x.getDay()]+" "+x.getDate()};
  const weeks=[];all.forEach((s,i)=>{const x=new Date(s+"T12:00:00");if(i===0||x.getDay()===1)weeks.push({len:0,a:s});const w=weeks[weeks.length-1];w.len++;w.b=s});
  const ts=iso(new Date()),ti=all.indexOf(ts);
  let g=`<div class="gg" style="grid-template-columns:minmax(230px,320px) 140px repeat(${n},minmax(48px,1fr))"><div class="wk"></div><div class="wk"></div>`;
  weeks.forEach((w,k)=>{g+=`<div class="wk" style="grid-column:span ${w.len}">SEM ${k+1} · ${sapd(w.a).slice(0,5)} – ${sapd(w.b).slice(0,5)}</div>`});
  g+=`<div class="hd hl">Actividad y dato requerido</div><div class="hd hl">Responsable</div>`+all.map((s,i)=>`<div class="hd num" style="${i===ti?"background:#fffbd0":""}">${dl(s)}</div>`).join("");
  P.forEach((p,idx)=>{const a=all.indexOf(p.inicio),b=all.indexOf(p.fin),o=OWN[p.tipo]||OWN.analista,dc=p.datoSAP?" dato":"";
    g+=`<div class="${dc}"><span><b>${esc(p.actividad)}</b>${p.detalle?` <span class="sm">· ${esc(p.detalle)}</span>`:""}</span></div><div class="sm${dc}">${esc(p.responsable)}</div>`;
    for(let i=0;i<n;i++){if(i===a&&b>=a){const sp=b-a+1;g+=p.tipo==="hito"?`<div class="ms${dc}" style="grid-column:span ${sp}" title="${esc(p.actividad)}"><i></i></div>`:`<div class="bar${dc}" style="grid-column:span ${sp}"><i style="background:${o[0]};animation-delay:${idx*80}ms" title="${esc(p.actividad)}: ${sapd(p.inicio)} – ${sapd(p.fin)}"></i></div>`;i=b}else g+=`<div class="${dc}"></div>`}});
  g+="</div>";
  const start=new Date(ds[0]+"T00:00:00"),t0=new Date(ts+"T00:00:00"),days=Math.round((start-t0)/864e5);
  const st=days>0?`Inicia en ${days} día${days===1?"":"s"}`:t0<=new Date(ds[ds.length-1]+"T00:00:00")?"En ejecución":"Plan cerrado";
  return `<section class="stage">
  ${head(8,"Plan de trabajo","En <em>2 semanas</em>, el mín./máx. de los 28 repuestos","Lo que manda el plazo es la entrega de datos y la validación de los planificadores. Ruta crítica: MB51 → IW39 → validación.")}
  ${grp("Diagrama de Gantt",`<div class="legend">${Object.values(OWN).map(o=>`<span><i style="background:${o[0]}"></i>${o[1]}</span>`).join("")}<span><i style="background:#fff7e3;border:1px solid #e6bf8a"></i>Fila resaltada: dato SAP que requerimos</span></div><div class="gantt">${g}</div>`,`<span class="chip ch-cy">${st}</span><span class="chip ch-am">Resultado: ${sapd(D.config.fechaResultado)}</span>`)}
  <div class="cols c3">
    <div class="kpi"><span class="v num">48 h</span><span class="l">MB51 de Almacén</span><span class="s">Ruta crítica: cada día de atraso corre el plan un día</span></div>
    <div class="kpi"><span class="v num am">~1 h</span><span class="l">Esfuerzo total de las áreas</span><span class="s">4 pedidos cortos y precisos</span></div>
    <div class="kpi"><span class="v num gr">45 min</span><span class="l">Validación por planta</span><span class="s">YN, PL y LQ</span></div>
  </div>
  ${grp("Hoja de ruta del análisis",`<div class="cols c3">${[
    ["Fase 1 · Yanacocha consolidado","ch-cy","En curso","Las 50 bombas como una sola flota (centro SAP 3000).","ME2M (recibido) · MB51 · MB52 · IW39 · criticidad","Categoría, mínimo, punto de reorden y máximo de los 28 repuestos, al "+sapd(D.config.fechaResultado)+"."],
    ["Fase 2 · Por planta y por falla","ch-nu","Siguiente","Stock de Yanacocha Norte, Pampa Larga y La Quinua, y por qué y cada cuánto falla cada pieza.","IW69 avisos con códigos de falla · IK17 horómetros · IP24 planes de mantenimiento · ubicaciones técnicas","Stock por planta y vida útil por pieza (Weibull, IEC 61649)."],
    ["Fase 3 · Más equipos","ch-nu","Futuro","El mismo método para otros equipos de la taxonomía ISO 14224.","Estándar de repuestos de cada equipo + los mismos datos SAP","Stock estándar por equipo, en esta misma página."]
  ].map(f=>`<div class="kpi" style="gap:6px"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><b style="color:var(--ttl);font-size:14px">${f[0]}</b><span class="chip ${f[1]}">${f[2]}</span></div><span>${f[3]}</span><span class="s"><b>Datos:</b> ${f[4]}</span><span class="s"><b>Resultado:</b> ${f[5]}</span></div>`).join("")}</div>`)}
  ${grp("¿Por qué primero Yanacocha y luego por planta?",`<div class="cols c4">${[
    ["1 · Los datos existen así","ISO 14224","Todo el historial SAP está en el centro 3000. La norma permite agrupar equipos similares para tener una población con valor estadístico."],
    ["2 · Por planta hay muy pocos consumos","Syntetos-Boylan","Dividido entre 3 plantas, la mayoría de los años queda en 0 y el mínimo sería inestable. Se pronostica arriba y se reparte hacia abajo."],
    ["3 · El stock compartido necesita menos reserva","Teoría de inventarios","Con 3 plantas que comparten stock, el stock de seguridad total baja en el orden del 40 % (regla de la raíz cuadrada; modelo METRIC de dos niveles)."],

  ].map(f=>`<div class="kpi" style="gap:6px"><b style="color:var(--ttl);font-size:14px">${f[0]}</b><span class="eyebrow" style="font-size:10.5px">${f[1]}</span><span>${f[2]}</span></div>`).join("")}</div>
  <div class="cols c2">
    <div class="info"><b>Cuándo convendría al revés:</b> si cada planta tuviera su propio centro SAP, almacén y presupuesto; si el traslado entre plantas tardara más de lo que la operación aguanta; o si las bombas trabajaran en condiciones muy distintas. Hoy no se cumple ninguna: un centro SAP, un estándar común y el mismo modelo de bomba.</div>
    <div class="note"><b>Señal a vigilar en la fase 2:</b> los planes de mantenimiento difieren (YN 18 y 36 meses, PL 9 y 18, LQ 12). Antes de usar un parámetro común se prueba que las plantas sean homogéneas, como pide ISO 14224; si una difiere, recibe parámetros propios.</div>
  </div>`)}
  ${nav2()}</section>`;
}

const VIEWS=[sPregunta,sFlota,sTaxo,sEstandar,sDatos,sDemanda,sCriticidad,sStock,sPlan,sSintesis];
let last=-1;
function render(){
  renderSteps();
  const st=$("#stage"),fid=document.activeElement&&document.activeElement.id,pos=document.activeElement&&document.activeElement.selectionStart;
  st.innerHTML=VIEWS[ST.step]();
  if(last===ST.step)st.querySelectorAll(".stage,.item,.gg .bar i").forEach(e=>e.style.animation="none");else countUp();
  last=ST.step;
  status(`Paso ${STEPS[ST.step][0]} · ${STEPS[ST.step][1]}`);
  if(fid&&document.getElementById(fid)){const el=document.getElementById(fid);el.focus();try{if(pos!=null&&el.setSelectionRange)el.setSelectionRange(pos,pos)}catch(e){}}
  bind();
}
function bind(){
  const on=(id,ev,fn)=>{const el=$("#"+id);if(el)el[ev]=fn};
  if(ST.step===3)on("stdq","oninput",e=>{ST.stdq=e.target.value;render()});
  if(ST.step===5){on("fq","oninput",e=>{ST.f.q=e.target.value;render()});[["fz","zona"],["fk","kit"],["fp","prio"],["fv","prop"],["fc","color"]].forEach(([id,k])=>on(id,"onchange",e=>{ST.f[k]=e.target.value;render()}));
    on("fclr","onclick",()=>{ST.f={q:"",zona:"",patron:[],kit:"",prio:"",prop:"",color:ST.f.color};render()})}
  if(ST.step===7){calcOut();[["cD","D"],["cS","S"],["cL","LT"],["cQ","Q"]].forEach(([id,k])=>on(id,"oninput",e=>{ST.calc[k]=Math.max(0,+e.target.value||0);const lb=e.target.parentElement.querySelector(".src");if(lb&&(k==="D"||k==="S")){const same=ST.calc[k]===ST.calc[k+"0"];lb.className="src "+(same?"me":"us");lb.textContent=same?"ME2M":"Editado"}calcOut()}));
    on("cZ","onchange",e=>{ST.calc.Z=e.target.value;calcOut()});on("cp","onchange",e=>{ST.selPart=e.target.value;ST.calc=null;render()});on("cReset","onclick",()=>{ST.calc=null;render()})}
}
function countUp(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  document.querySelectorAll("[data-count]").forEach(el=>{const to=+el.dataset.count;if(!to)return;const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/800);el.textContent=Math.round(to*(1-Math.pow(1-k,3))).toLocaleString("es-ES");if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-s],[data-go],[data-zona],[data-planta],[data-tv],[data-part],[data-ficha],[data-win],[data-sort],[data-pat],[data-sim]");if(!t)return;
  if(t.dataset.s!=null)return go(+t.dataset.s);
  if(t.dataset.go!=null)return go(+t.dataset.go);
  if(t.dataset.win)return openWin(t.dataset.win);
  if(t.dataset.ficha)return openWin("ficha",t.dataset.ficha);
  if(t.dataset.sim){ST.selPart=t.dataset.sim;ST.calc=null;return go(7)}
  if(t.dataset.pat){const p=t.dataset.pat,a=ST.f.patron;ST.f.patron=a.includes(p)?a.filter(x=>x!==p):a.concat(p);return render()}
  if(t.dataset.zona){ST.zona=t.dataset.zona;if(ST.step!==2)go(2);else render();return}
  if(t.dataset.planta!=null){ST.planta=t.dataset.planta;return render()}
  if(t.dataset.tv){ST.tview=t.dataset.tv;return render()}
  if(t.dataset.sort){const k=t.dataset.sort;ST.sort=ST.sort.k===k?{k,d:-ST.sort.d}:{k,d:1};return render()}
  if(t.dataset.part){ST.selPart=t.dataset.part;if(ST.step===5){render();return}return openWin("ficha",t.dataset.part)}
});
$("#scrim").onclick=closeWin;$("#winX").onclick=closeWin;
function closeMenus(){document.querySelectorAll(".mlist.open").forEach(m=>m.classList.remove("open"));document.querySelectorAll(".mbtn").forEach(b=>b.setAttribute("aria-expanded","false"))}
document.addEventListener("click",e=>{const b=e.target.closest(".mbtn");if(b){const m=$("#m-"+b.dataset.menu),o=!m.classList.contains("open");closeMenus();if(o){m.classList.add("open");b.setAttribute("aria-expanded","true");m.querySelector("button").focus()}return}if(!e.target.closest(".mlist")||e.target.closest("[data-win]"))closeMenus()},true);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeMenus();return closeWin()}
  const tg=e.target.tagName;if(tg==="INPUT"||tg==="SELECT"||tg==="TEXTAREA"||$("#win").classList.contains("open"))return;
  if(e.key==="ArrowRight")go(ST.step+1);else if(e.key==="ArrowLeft")go(ST.step-1);else if(/^[0-9]$/.test(e.key))go(+e.key);
});
window.addEventListener("hashchange",()=>{const h=location.hash.replace("#","");if(HM.includes(h)&&HM.indexOf(h)!==ST.step)go(HM.indexOf(h))});
render();
})();
</script>
